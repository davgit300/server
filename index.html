<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Steuerung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* Dunkler Hintergrund */
            color: #f0f0f0; /* Helle Schriftfarbe */
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        #startButton {
            background-color: #28a745; /* Grüner Button */
            color: white;
        }
        #stopButton {
            background-color: #dc3545; /* Roter Button */
            color: white;
        }
    </style>
</head>
<body>
    <h1>Minecraft Server Steuerung</h1>
    <button id="startButton">Server starten</button>
    <button id="stopButton">Server stoppen</button>
    <p id="timer">Server ist momentan gestoppt.</p>

    <script>
        let countdown;
        let remainingSeconds = 300; // 5 Minuten in Sekunden
        const timerElement = document.getElementById('timer');

        document.getElementById('startButton').addEventListener('click', () => {
            timerElement.textContent = `Server wird gestartet.`;
            startCountdown();
        });

        document.getElementById('stopButton').addEventListener('click', () => {
            timerElement.textContent = `Server wird gestoppt.`;
            clearCountdown();
        });

        function startCountdown() {
            clearInterval(countdown);
            updateTimer();
            countdown = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds <= 0) {
                    clearInterval(countdown);
                    timerElement.textContent = 'Server wurde wegen abwesender Spieler gestoppt.';
                    
                    // Nach 1 Minute wieder zurück zur Standard-Nachricht
                    setTimeout(() => {
                        timerElement.textContent = 'Server ist momentan gestoppt.';
                    }, 60000);

                } else {
                    updateTimer();
                }
            }, 1000);
        }

        function clearCountdown() {
            clearInterval(countdown);
            remainingSeconds = 300; // Zurücksetzen auf 5 Minuten
            timerElement.textContent = 'Server ist momentan gestoppt.';
        }

        function updateTimer() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            timerElement.textContent = `Verbleibende Zeit: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }
    </script>
</body>
</html>
